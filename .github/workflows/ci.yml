name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Compile sources
        run: python -m compileall -q src examples
      - name: Run offline smoke test
        run: agent-society demo --db smoke.db --goal-id ci-smoke --json

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agent_society
          POSTGRES_PASSWORD: agent_society
          POSTGRES_DB: agent_society_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_society -d agent_society_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SCHEDULER_POSTGRES_URL: postgresql://agent_society:agent_society@localhost:5432/agent_society_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with PostgreSQL support
        run: python -m pip install -e ".[postgres]"
      - name: Run PostgreSQL scheduler conformance
        run: python -m unittest tests.test_postgres_storage -v

