[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seed-society"
version = "1.3.0"
description = "Auditable double-loop runtime for specialized AI agent societies"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "woshishadowhunter" }]
keywords = ["agents", "multi-agent", "orchestration", "ai", "memory"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]

[project.urls]
Homepage = "https://github.com/woshishadowhunter/seed-society"
Repository = "https://github.com/woshishadowhunter/seed-society"
Issues = "https://github.com/woshishadowhunter/seed-society/issues"
Documentation = "https://github.com/woshishadowhunter/seed-society#readme"
Changelog = "https://github.com/woshishadowhunter/seed-society/blob/main/CHANGELOG.md"

[project.scripts]
seed-society = "seed_society.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
